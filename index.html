         set per-route by react-helmet-async in each page component (including
         Home for "/"). Deliberately not duplicated here: Helmet doesn't remove
         static tags already present in this file, so a static <title>/<meta
         name="description"> here would leave two of each in the DOM on every
         route instead of being replaced. -->
